<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sty.css">
    <title>Document</title>
</head>
<body>
    <section>
        <img id="img" src="" alt="شعار المحل">
        <video id="myVideo" src="" muted autoplay></video>
    
        <audio id="bg-music" loop></audio>
    </section>

    <script>
       
        let images = ["img/1.png", "img/2.png", "img/3.png"];
        document.getElementById("img").src = images[Math.floor(Math.random() * images.length)];

        let music = ["img/5.mp3", "img/6.mp3"];
        let bgMusic = document.getElementById("bg-music");
        bgMusic.src = music[Math.floor(Math.random() * music.length)];
        bgMusic.volume = 0.5; 

      
        let video = ["img/Shop_shutter_opening_with_bicyclist_20261013224444.mp4", "img/000.mp4"];
        document.getElementById("myVideo").src = video[Math.floor(Math.random() * video.length)];

        function playAudio() {
            bgMusic.play().then(() => {
                console.log("Music started playing successfully!");
                window.removeEventListener('click', playAudio);
                window.removeEventListener('touchstart', playAudio);
            }).catch(error => {
                console.log("Play failed:", error);
            });
        }

    
        window.addEventListener('click', playAudio);
        window.addEventListener('touchstart', playAudio);
    </script>
</body>
</html>
